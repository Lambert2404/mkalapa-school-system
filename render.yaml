services:
  - type: web
    name: mkalapa-school-system
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: mkalapa-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SMS_PROVIDER
        value: "mock"
      - key: SMS_TEST_MODE
        value: "True"
    healthCheckPath: /api/

databases:
  - name: mkalapa-db
    plan: free
    databaseName: mkalapa_db
